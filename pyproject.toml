[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreview"
version = "0.2.0"
description = "A plan / execute / review harness for trustworthy computational analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "antonoresten", email = "antonoresten@proton.me" }]
keywords = ["analysis", "review", "agents", "reproducibility", "bioinformatics"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autoreview = "autoreview.cli:main"

[project.urls]
Homepage = "https://github.com/antonoresten/autoreview"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
